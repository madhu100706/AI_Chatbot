<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">

    <div class="header-content">

        <div class="header-avatar">
            🤖
        </div>

        <div class="header-info">
            <h1>AI Assistant</h1>

            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </div>

    </div>

    <button id="clear-button">Clear Chat</button>

</div>


<div class="chat-box" id="chat-box">
    <div style="color: red; font-size: 30px; font-weight: bold;">
    TEST MESSAGE
</div>
    <div class="welcome-message">


    <div class="welcome-icon">
        ✨
    </div>

    <h2>Welcome! 👋</h2>

    <p>
        I'm your AI Assistant.
        Ask me anything and let's get started.
    </p>

    <div class="suggestions">

        <button onclick="useSuggestion('What is Python?')">
            🐍 What is Python?
        </button>

        <button onclick="useSuggestion('Explain artificial intelligence')">
            🤖 Explain AI
        </button>

        <button onclick="useSuggestion('Help me learn programming')">
            💻 Learn programming
        </button>

    </div>
    </div>

</div>

        <div class="chat-input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button id="send-button" type="button">
                <span>Send</span>
                <span class="send-icon">➤</span>
            </button>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
